# Blueprint de Render para MantiJudicial (https://render.com/blueprints)
#
# El corpus (cases/), la legislación (laws/) y la identidad (data/identity.json)
# NO viajan por la rama main: viven en la rama 'data' del repo privado
# mantijudicial-data (ver DATA_REPO en scripts/render-bootstrap.sh) y este
# script los copia al disco persistente la primera vez.
services:
  - type: web
    name: mantijudicial
    runtime: node
    plan: starter # el disco persistente no existe en el plan gratuito
    buildCommand: bash scripts/render-bootstrap.sh && pnpm install && pnpm --dir apps/web build
    startCommand: bash scripts/render-bootstrap.sh && pnpm --dir apps/web start
    disk:
      name: mantijudicial-data
      mountPath: /var/data/mantijudicial
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: MANTIJUDICIAL_ROOT
        value: /var/data/mantijudicial/repo
      # IA: con AI_API_KEY se usa un endpoint compatible con OpenAI;
      # sin ella (o con AI_PROVIDER=opencode) se usa el binario de opencode.
      - key: AI_PROVIDER
        value: http
      - key: AI_API_KEY
        sync: false # pégala en el panel de Render (Secret File/Environment)
      - key: AI_BASE_URL
        sync: false # opcional: https://api.openai.com/v1 (o OpenRouter, DeepSeek…)
      - key: AI_MODEL
        sync: false # opcional: gpt-4o-mini, deepseek-chat…
    healthCheckPath: /login
