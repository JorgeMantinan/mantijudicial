# Verificación en CI: tipos + tests + `next build` de la web.
# El corpus real (cases/, laws/) vive en el repo privado mantijudicial-data
# (rama `data`) y no está en main,
# así que ANTES del build se crea un corpus de juguete en un directorio
# temporal (scripts/crear-corpus-juguete.mjs) y `MANTIJUDICIAL_ROOT` apunta a
# él: `repoRoot()` lo encuentra y el build no toca ningún dato real.
# El build con el corpus completo se sigue haciendo en local (AGENTS.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Misma versión mayor que en local (el lockfile es de pnpm 11).
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Typecheck (pipeline/)
        run: pnpm typecheck

      - name: Typecheck (apps/web)
        run: pnpm --dir apps/web exec tsc --noEmit

      - name: Tests (vitest)
        run: pnpm test

      - name: Corpus de juguete (para poder compilar la web)
        run: node scripts/crear-corpus-juguete.mjs "$RUNNER_TEMP/corpus"

      - name: Build de producción (apps/web)
        run: pnpm --dir apps/web exec next build
        env:
          MANTIJUDICIAL_ROOT: ${{ runner.temp }}/corpus
